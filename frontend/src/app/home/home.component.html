<div>
  <button class="button" (click)="onUploadClicked()">Upload</button>
  @if (files.length) {
    <table class="table">
      <thead>
        <tr>
          <th>Org File Name</th>
          <th>File Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (f of files; track f) {
          <tr>
            <td>{{ f.orgFileName }}</td>
            <td>{{ f.fileName }}</td>
            <td>
              <button class="button" (click)="deleteFile(f.id)">Delete</button>
              <button class="button" (click)="openFile(f)">Open</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
  @if (!files.length) {
    <p>No files</p>
  }

  @if (showUpload) {
    <app-upload-dialog (close)="onUploadFinished($event)"></app-upload-dialog>
  }
</div>
