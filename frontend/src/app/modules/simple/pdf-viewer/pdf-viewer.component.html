<div
  class="viewer-layout"
  style="display: flex; flex-direction: row; height: 100vh; width: 100%; overflow: hidden"
>
  <app-activity-bar style="flex-shrink: 0"></app-activity-bar>

  <app-pdf-content
    class="main-content"
    style="flex: 1; height: 100%; overflow-y: auto"
    [documentId]="documentId"
    [pageCount]="pageCount"
    [activePage]="currentVisiblePage"
    (visiblePageChanged)="onVisiblePageChanged($event)"
  >
  </app-pdf-content>

  <app-thumbnail-sidebar
    style="flex-shrink: 0; height: 100%"
    [documentId]="documentId"
    [pageCount]="pageCount"
    [activePage]="currentVisiblePage"
    (pageSelected)="onSidebarPageSelected($event)"
  >
  </app-thumbnail-sidebar>
</div>
