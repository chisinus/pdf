<div class="pdf-scroll-container" style="padding: 20px; background: #9ca3af; min-height: 100%">
  @for (page of pages; track page) {
    <div
      #pageContainer
      class="page-wrapper"
      style="
        position: relative;
        margin: 0 auto 20px auto;
        width: fit-content;
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      "
      [attr.data-page-number]="page"
    >
      <!-- Render the actual page image if it's within the visible buffer -->
      @if (isPageRendered(page)) {
        <img
          [src]="'http://localhost:4001/api/thumbnails/' + documentId + '/' + page"
          alt="Page {{ page }}"
          style="display: block; width: 100%; min-width: 400px; user-select: none"
          (dragstart)="$event.preventDefault()"
        />
      } @else {
        <!-- Skeleton loader for off-screen pages -->
        <div
          style="
            height: 600px;
            width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <span style="color: #6b7280">Loading Page {{ page }}...</span>
        </div>
      }

      <!-- SVG Overlay to draw annotations -->
      <svg
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none"
      >
        <!-- Render all confirmed lines for this page -->
        @for (line of lines; track line) {
          @if (line.page === page) {
            <line
              [attr.x1]="line.startX"
              [attr.y1]="line.startY"
              [attr.x2]="line.endX"
              [attr.y2]="line.endY"
              stroke="red"
              stroke-width="2"
              stroke-linecap="round"
            />
          }
        }

        <!-- Render the line currently being drawn -->
        @if (currentLine && currentLine.page === page) {
          <line
            [attr.x1]="currentLine.startX"
            [attr.y1]="currentLine.startY"
            [attr.x2]="currentLine.endX"
            [attr.y2]="currentLine.endY"
            stroke="blue"
            stroke-width="2"
            stroke-dasharray="4"
            stroke-linecap="round"
          />
        }
      </svg>
    </div>
  }
</div>
