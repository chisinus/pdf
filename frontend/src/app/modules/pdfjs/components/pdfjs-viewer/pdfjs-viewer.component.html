<div class="viewer-layout">
  <aside class="activity-bar">
    <div class="toolbar-title">Tools</div>
    <button (click)="setTool(AnnotationType.Arrow)">Arrow</button>
    <button (click)="setTool(AnnotationType.Freehand)">Pen</button>
    <button (click)="setTool(AnnotationType.Rectangle)">Rectangle</button>
    <button (click)="setTool(AnnotationType.Highlight)">Highlight</button>
    <button (click)="save()">Save Annotations</button>
  </aside>

  <section class="viewer-main" #scrollContainer>
    <div #container class="pdf-container"></div>
  </section>

  <app-pdfjs-thumbnail-sidebar
    class="thumbnail-sidebar"
    [documentId]="documentId"
    [pageCount]="numPages || pageCount"
    [activePage]="currentVisiblePage"
    (pageSelected)="scrollToPage($event)"
  ></app-pdfjs-thumbnail-sidebar>
</div>
